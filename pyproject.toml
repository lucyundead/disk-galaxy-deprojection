[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "disk-galaxy-deprojection"
version = "0.4.1"
description = "Learned mass-conserving deprojection of galaxy images -> 3D stellar density, rotation curve, potential."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "lucyundead", email = "lucyundead@126.com" }]
keywords = ["astronomy", "galaxies", "deprojection", "rotation-curve", "TNG50", "photometry"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
  "numpy>=1.26",
  "astropy>=6.0",
  "matplotlib>=3.8",
]

[project.urls]
Homepage = "https://github.com/lucyundead/disk-galaxy-deprojection"
Repository = "https://github.com/lucyundead/disk-galaxy-deprojection"
Issues = "https://github.com/lucyundead/disk-galaxy-deprojection/issues"

[project.optional-dependencies]
# retraining the bundled model (needs the TNG table); end users do NOT need these
train = [
  "torch>=2.1",
  "scipy>=1.11",
  "pandas>=2.1",
  "h5py>=3.10",
]
dev = [
  "pytest>=7.4",
  "ruff>=0.1",
]

[project.scripts]
dgdp-deproject = "dgdp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dgdp = ["models/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
# NGC4371/ holds a collaborator's S4G/GALFIT/MGE reference data + notebooks (B. Tahmasebzadeh),
# not project source -- don't lint it.
extend-exclude = ["NGC4371"]
