[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "disk-galaxy-deprojection"
version = "0.2.0"
description = "Learned mass-conserving deprojection of galaxy images -> 3D stellar density, rotation curve, potential."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "astropy>=6.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
# retraining the bundled model (needs the TNG table); end users do NOT need these
train = [
  "torch>=2.1",
  "scipy>=1.11",
  "pandas>=2.1",
  "h5py>=3.10",
]
dev = [
  "pytest>=7.4",
  "ruff>=0.1",
]

[project.scripts]
dgdp-deproject = "dgdp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dgdp = ["models/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
# NGC4371/ holds a collaborator's S4G/GALFIT/MGE reference data + notebooks (B. Tahmasebzadeh),
# not project source -- don't lint it.
extend-exclude = ["NGC4371"]
