name: release

# Publishes to PyPI via Trusted Publishing (OIDC, no stored token) when a version tag is pushed.
#
# One-time PyPI setup: pypi.org -> your project -> Settings -> Publishing -> Add a trusted publisher
#   Owner: lucyundead   Repository: disk-galaxy-deprojection
#   Workflow name: release.yml   Environment name: pypi
#
# Cut a release: bump `version` in pyproject.toml (PyPI forbids re-uploading a version), then
#   git commit -am "release X.Y.Z"
#   git tag -a vX.Y.Z -m "dgdp X.Y.Z"
#   git push origin <branch> && git push origin vX.Y.Z

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches pyproject version
        run: |
          VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG=${GITHUB_REF_NAME#v}
          test "$VER" = "$TAG" || { echo "::error::tag $TAG != pyproject version $VER"; exit 1; }
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Smoke-test the wheel (torch-free core install)
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install dist/*.whl
          /tmp/v/bin/python -c "import dgdp; print('import ok', dgdp.__version__)"
          /tmp/v/bin/dgdp-deproject --help
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write            # OIDC token for Trusted Publishing (no PyPI token stored)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
